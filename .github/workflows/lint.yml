name: Lint & Tests

on:
  push:
    branches: [ main, feature/*, chore/*, ci/*, test/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run flake8
        run: flake8 --config .flake8 core automation

      - name: Run black check
        run: black --check core automation

      - name: Run smoke tests
        run: pytest -q tests
